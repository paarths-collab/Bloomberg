<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wealth OS</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #121212;
            --border: #2a2a2a;
            --text-primary: #ededed;
            --text-secondary: #888888;
            --accent: #ffffff;
            --success: #34d399;
            --active-glow: 0 0 10px rgba(52, 211, 153, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: 'Manrope', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        /* HEADER */
        header {
            margin-bottom: 50px;
            text-align: center;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -2px;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* INPUT CARD */
        .input-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            transition: all 0.3s;
        }

        .market-switch {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .market-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 10px 30px;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Space Grotesk';
            transition: 0.3s;
        }

        .market-btn.active {
            background: var(--text-primary);
            color: var(--bg);
            border-color: var(--text-primary);
        }

        textarea {
            width: 100%;
            background: #0f0f0f;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 15px;
            border-radius: 8px;
            min-height: 120px;
            font-family: 'Manrope';
            font-size: 1.1rem;
            resize: vertical;
        }

        .primary-btn {
            background: var(--text-primary);
            color: var(--bg);
            border: none;
            padding: 18px;
            width: 100%;
            border-radius: 8px;
            font-family: 'Space Grotesk';
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.1);
        }

        .primary-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* DYNAMIC PROGRESS STEPS */
        .steps-container {
            display: none;
            /* Active during process */
            margin: 40px 0;
        }

        .steps-grid {
            display: flex;
            justify-content: space-between;
            position: relative;
        }

        .steps-grid::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--border);
            z-index: 0;
            transform: translateY(-50%);
        }

        .step-item {
            position: relative;
            z-index: 1;
            background: var(--bg);
            padding: 0 10px;
            text-align: center;
        }

        .dot {
            width: 12px;
            height: 12px;
            background: var(--border);
            border-radius: 50%;
            margin: 0 auto 10px;
            transition: 0.4s;
        }

        .step-name {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-family: 'Space Grotesk';
            transition: 0.4s;
        }

        /* Active State (Pulsing) */
        .step-item.active .dot {
            background: var(--text-primary);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
            transform: scale(1.4);
            border: 2px solid #fff;
        }

        .step-item.active .step-name {
            color: var(--text-primary);
            font-weight: 600;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        }

        /* Done State (Green) */
        .step-item.done .dot {
            background: var(--success);
            box-shadow: 0 0 10px var(--success), 0 0 20px var(--success);
            transform: scale(1.1);
        }

        .step-item.done .step-name {
            color: var(--success);
            font-weight: 500;
        }

        .status-text {
            text-align: center;
            margin-top: 20px;
            color: var(--text-secondary);
            font-family: 'Space Grotesk';
            font-size: 0.9rem;
            min-height: 20px;
        }

        /* DASHBOARD GRID */
        .dashboard-grid {
            display: none;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
            animation: slideUp 0.6s ease;
        }

        .dashboard-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-header {
            font-family: 'Space Grotesk';
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .asset-main {
            font-size: 2rem;
            font-weight: 500;
            font-family: 'Space Grotesk';
            margin-bottom: 5px;
        }

        .asset-sub {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .d3-chart-container {
            width: 100%;
            height: 200px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0) 100%);
            border-radius: 8px;
            margin-bottom: 20px;
            position: relative;
        }

        .action-btn {
            background: var(--text-primary);
            color: #000;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-weight: 700;
            font-family: 'Space Grotesk';
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
        }

        .action-btn.alpaca {
            background: #FCD535;
        }

        .action-btn:hover {
            opacity: 0.9;
        }

        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #333;
            padding: 8px;
            border-radius: 4px;
            pointer-events: none;
            font-size: 0.8rem;
            font-family: 'Space Grotesk';
            opacity: 0;
            transition: 0.1s;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <header>
            <h1>WEALTH OS</h1>
            <p class="subtitle">Autonomous Financial Intelligence</p>
        </header>

        <main>
            <!-- INPUT SECTION -->
            <div class="input-card" id="inputSection">
                <div class="market-switch">
                    <button class="market-btn active" data-market="US">US Market 🇺🇸</button>
                    <button class="market-btn" data-market="IN">India 🇮🇳</button>
                </div>
                <textarea id="userInput"
                    placeholder="Describe your financial situation, goals, and risk tolerance..."></textarea>
                <div style="height: 20px;"></div>
                <button id="analyzeBtn" class="primary-btn">GENERATE STRATEGY</button>
            </div>

            <!-- DYNAMIC PROGRESS TRACKER -->
            <div id="progressSection" class="steps-container">
                <div class="steps-grid">
                    <div id="step-profile" class="step-item">
                        <div class="dot"></div>
                        <div class="step-name">Profile</div>
                    </div>
                    <div id="step-sector" class="step-item">
                        <div class="dot"></div>
                        <div class="step-name">Sector</div>
                    </div>
                    <div id="step-stock" class="step-item">
                        <div class="dot"></div>
                        <div class="step-name">Stocks</div>
                    </div>
                    <div id="step-mf" class="step-item">
                        <div class="dot"></div>
                        <div class="step-name">Funds</div>
                    </div>
                    <div id="step-bonds" class="step-item">
                        <div class="dot"></div>
                        <div class="step-name">Bonds</div>
                    </div>
                    <div id="step-report" class="step-item">
                        <div class="dot"></div>
                        <div class="step-name">Report</div>
                    </div>
                </div>
                <div id="logMessage" class="status-text">Initializing AI agents...</div>
            </div>

            <!-- DASHBOARD -->
            <div id="dashboardArea" class="dashboard-grid">

                <!-- 1. STOCK ACTION CARD -->
                <div class="dashboard-card" style="grid-column: 1 / -1;">
                    <div style="display: flex; justify-content: space-between;">
                        <div>
                            <div class="card-header">Target Strategy</div>
                            <div id="stockName" class="asset-main">Loading...</div>
                            <div id="stockReason" class="asset-sub">Analyzing momentum...</div>
                        </div>
                        <div style="text-align: right;">
                            <div id="projectedReturn" class="asset-main" style="color: var(--success)">--%</div>
                            <div class="card-header">Proj. Return</div>
                        </div>
                    </div>

                    <div id="d3Chart" class="d3-chart-container"></div>
                    <div id="chartTooltip" class="tooltip"></div>

                    <button id="buyStockBtn" class="action-btn alpaca">Execute Trade (Alpaca)</button>
                    <div id="stockMsg" style="color:var(--success); text-align:center; margin-top:10px; display:none;">
                    </div>
                </div>

                <!-- 2. MUTUAL FUND CARD -->
                <div class="dashboard-card">
                    <div>
                        <div class="card-header">Mutual Fund SIP</div>
                        <div id="mfName" class="asset-main">--</div>
                        <div id="mfCategory" class="asset-sub">--</div>
                    </div>
                    <button class="action-btn">Setup SIP</button>
                </div>

                <!-- 3. BOND CARD -->
                <div class="dashboard-card">
                    <div>
                        <div class="card-header">Fixed Income</div>
                        <div id="bondName" class="asset-main">--</div>
                        <div id="bondType" class="asset-sub">--</div>
                    </div>
                    <button class="action-btn">Buy Bonds</button>
                </div>

            </div>

        </main>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api/wealth';
        let market = 'US';
        let generatedData = null;

        // Elements
        const analyzeBtn = document.getElementById('analyzeBtn');
        const userInput = document.getElementById('userInput');
        const progressSection = document.getElementById('progressSection');
        const dashboardArea = document.getElementById('dashboardArea');
        const logMessage = document.getElementById('logMessage');
        const buyStockBtn = document.getElementById('buyStockBtn');

        // Market Toggle
        document.querySelectorAll('.market-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.market-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                market = btn.dataset.market;
            });
        });

        // Main Logic
        analyzeBtn.addEventListener('click', async () => {
            const text = userInput.value.trim();
            if (!text) return alert("Please enter input");

            // Reset UI
            analyzeBtn.disabled = true;
            analyzeBtn.innerText = "PROCESSING...";
            progressSection.style.display = 'block';
            dashboardArea.style.display = 'none';
            resetSteps();

            // SSE
            const evtSource = new EventSource(`${API_BASE}/analyze/stream?user_input=${encodeURIComponent(text)}&market=${market}`);

            evtSource.onmessage = (e) => {
                const data = JSON.parse(e.data);

                if (data.stage === 'error') {
                    evtSource.close();
                    logMessage.innerText = "Error: " + data.message;
                    analyzeBtn.disabled = false;
                    return;
                }

                if (data.stage === 'complete') {
                    evtSource.close();
                    updateStep('report'); // Ensure final step is done
                    setTimeout(() => {
                        renderDashboard(data.data);
                    }, 1000); // Slight delay to show off all green checks
                    return;
                }

                // Update Active Step
                logMessage.innerText = data.message;
                updateStep(data.stage);
            };
        });

        function updateStep(stage) {
            const map = {
                'input': 'step-profile',
                'profile': 'step-profile',
                'sector': 'step-sector',
                'stock': 'step-stock',
                'mf': 'step-mf',
                'bonds': 'step-bonds',
                'report': 'step-report'
            };

            const activeId = map[stage];
            if (!activeId) return;

            // Logic: Mark everything BEFORE this as DONE. Mark this one as ACTIVE.
            const steps = ['step-profile', 'step-sector', 'step-stock', 'step-mf', 'step-bonds', 'step-report'];
            let foundActive = false;

            steps.forEach(id => {
                const el = document.getElementById(id);
                if (id === activeId) {
                    el.classList.add('active');
                    el.classList.remove('done');
                    foundActive = true;
                } else if (!foundActive) {
                    el.classList.add('done');
                    el.classList.remove('active');
                } else {
                    el.classList.remove('active', 'done');
                }
            });
        }

        function resetSteps() {
            document.querySelectorAll('.step-item').forEach(el => el.classList.remove('active', 'done'));
        }

        function renderDashboard(data) {
            generatedData = data;
            progressSection.style.display = 'none'; // Hide progress after completion
            dashboardArea.style.display = 'grid';
            analyzeBtn.innerText = "GENERATE NEW STRATEGY";
            analyzeBtn.disabled = false;

            // Populate Stock
            const stock = data.selected_stock || {};
            const backtest = (data.stock_backtests || {})[stock.Ticker] || {};

            document.getElementById('stockName').innerText = stock.Ticker || "N/A";
            document.getElementById('stockReason').innerText = `Primary Sector: ${data.selected_sector || 'N/A'}`;

            const ret = backtest.total_return;
            document.getElementById('projectedReturn').innerText = (ret !== undefined && ret !== null) ? `+${parseFloat(ret).toFixed(1)}%` : "--%";

            // Update Button
            const label = market === "IN" ? "Zerodha (₹)" : "Alpaca ($)";
            buyStockBtn.innerText = `EXECUTE TRADE VIA ${label}`;

            // Populate MF & Bonds
            const mf = data.selected_mf || {};
            document.getElementById('mfName').innerText = (mf.suggested_names || [])[0] || (mf.category ? mf.category.toUpperCase() : "N/A");
            document.getElementById('mfCategory').innerText = mf.subcategory || "N/A";

            const bond = data.selected_bonds || {};
            document.getElementById('bondName').innerText = (bond.specific_instruments || [])[0] || "Govt Bond";
            document.getElementById('bondType').innerText = bond.bond_type || "N/A";

            // Render D3 Chart
            if (backtest.chart_data && backtest.chart_data.length > 0) {
                renderD3Chart(backtest.chart_data);
            }

            // Render Advanced Metrics (Judge-Impressive)
            if (backtest.metrics) {
                const m = backtest.metrics;
                const sharpe = m["Sharpe Ratio"] || "0.0";
                const maxDD = m["Max Drawdown %"] || "0.0";
                const cagr = m["CAGR %"] || "0.0";

                // We'll inject these into a new metrics container if it exists, or append
                // For now, let's create a metrics string in the Stock card
                const container = document.getElementById('stockReason');
                container.innerHTML = `
                    <div style="margin-bottom:10px;">Primary Sector: ${data.selected_sector || 'N/A'}</div>
                    <div style="display:flex; gap:15px; font-size:0.8rem; color:var(--text-secondary);">
                        <span title="Risk-adjusted return">Sharpe: <b style="color:#fff">${sharpe}</b></span>
                        <span title="Max loss from peak">Max DD: <b style="color:#ff4d4d">${maxDD}%</b></span>
                        <span title="Annual Growth">CAGR: <b style="color:#34d399">${cagr}%</b></span>
                    </div>
                `;
            }
        }

        function renderD3Chart(data) {
            const container = document.getElementById('d3Chart');
            container.innerHTML = ''; // Clear

            const margin = { top: 10, right: 0, bottom: 20, left: 0 };
            const width = container.clientWidth - margin.left - margin.right;
            const height = container.clientHeight - margin.top - margin.bottom;

            const svg = d3.select(container).append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom)
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            const parsedData = data.map(d => ({
                date: d3.timeParse("%Y-%m-%d")(d.date),
                value: d.value,
                rsi: d.rsi || 50
            }));

            const x = d3.scaleTime().range([0, width]).domain(d3.extent(parsedData, d => d.date));
            const y = d3.scaleLinear().range([height - 30, 0]).domain(d3.extent(parsedData, d => d.value));

            // Gradient for Area
            const defs = svg.append("defs");
            const gradient = defs.append("linearGradient").attr("id", "chartGrad").attr("x1", "0%").attr("y1", "0%").attr("x2", "0%").attr("y2", "100%");
            gradient.append("stop").attr("offset", "0%").attr("stop-color", "#34d399").attr("stop-opacity", 0.3);
            gradient.append("stop").attr("offset", "100%").attr("stop-color", "#34d399").attr("stop-opacity", 0);

            // Price Area
            const area = d3.area().x(d => x(d.date)).y0(height - 30).y1(d => y(d.value)).curve(d3.curveMonotoneX);
            svg.append("path").datum(parsedData).attr("fill", "url(#chartGrad)").attr("d", area);

            // Price Line
            const line = d3.line().x(d => x(d.date)).y(d => y(d.value)).curve(d3.curveMonotoneX);
            svg.append("path").datum(parsedData).attr("fill", "none").attr("stroke", "#34d399").attr("stroke-width", 2).attr("d", line);

            // RSI Line (Overlay at bottom, scaled 0-100 to bottom 30px? No, hard to see. Let's do a faint overlay or separate color)
            // Let's overlay RSI in yellow, reusing the y-scale? No, RSI is 0-100.
            // We'll map RSI 0-100 to the height.
            const yRsi = d3.scaleLinear().range([height, height - 50]).domain([0, 100]); // Bottom 50px

            const rsiLine = d3.line().x(d => x(d.date)).y(d => yRsi(d.rsi)).curve(d3.curveMonotoneX);
            svg.append("path")
                .datum(parsedData)
                .attr("fill", "none")
                .attr("stroke", "#FCD535") // Yellow
                .attr("stroke-width", 1.5)
                .attr("stroke-opacity", 0.8)
                .attr("d", rsiLine);

            // Tooltip
            const tooltip = d3.select("#chartTooltip");
            const bisect = d3.bisector(d => d.date).left;

            svg.append("rect")
                .attr("width", width)
                .attr("height", height)
                .style("fill", "none")
                .style("pointer-events", "all")
                .on("mousemove", function (event) {
                    const x0 = x.invert(d3.pointer(event)[0]);
                    const i = bisect(parsedData, x0, 1);
                    const d = parsedData[i];
                    if (d) {
                        tooltip.style("opacity", 1)
                            .style("left", (event.pageX + 10) + "px")
                            .style("top", (event.pageY - 20) + "px")
                            .html(`
                                <b>${d3.timeFormat("%b %d")(d.date)}</b><br>
                                Price: $${Math.round(d.value)}<br>
                                <span style="color:#FCD535">RSI: ${Math.round(d.rsi)}</span>
                            `);
                    }
                }).on("mouseleave", () => tooltip.style("opacity", 0));
        }

        // Trade Execution
        buyStockBtn.addEventListener('click', async () => {
            if (!generatedData) return;
            buyStockBtn.innerText = "EXECUTING...";
            try {
                const res = await fetch(`${API_BASE}/trade/execute`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ticker: generatedData.selected_stock.Ticker,
                        amount: 1,
                        market: market
                    })
                });
                const ret = await res.json();
                if (ret.success) {
                    buyStockBtn.innerText = "SUCCESS";
                    buyStockBtn.style.background = "#34d399";
                    document.getElementById('stockMsg').innerText = ret.message;
                    document.getElementById('stockMsg').style.display = 'block';
                } else {
                    alert(ret.detail);
                    buyStockBtn.innerText = "FAILED";
                }
            } catch (e) {
                alert(e);
            }
        });
    </script>
</body>

</html>
