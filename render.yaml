services:
  - type: web
    name: bloomberg-backend
    env: python
    plan: starter
    autoDeploy: true
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PEERS_PREMIUM
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_FALLBACK_TO_SQLITE
        value: "false"
      - key: AUTH_SECRET_KEY
        sync: false
      # Guest-token rate limiting (POST /api/auth/guest); see DEPLOY_VERCEL_RENDER.md.
      # Behind Render's proxy request.client is the proxy, so the client IP must come from
      # X-Forwarded-For. HOPS "2" assumes the documented topology: browser -> Vercel (the Next
      # rewrite adds the client IP) -> Render proxy -> app. That is UNVERIFIED until deployed.
      # A client calling Render directly (no Vercel) needs "1". A wrong value is unsafe: too high
      # lets clients spoof their key, too low collapses all users into one shared key.
      - key: AUTH_TRUST_PROXY
        value: "1"
      - key: AUTH_TRUST_PROXY_HOPS
        value: "2"
      - key: AUTH_GUEST_RATE_LIMIT
        value: "20"
      - key: AUTH_GUEST_RATE_WINDOW_SECONDS
        value: "3600"
      - key: AUTH_GUEST_GLOBAL_LIMIT
        value: "2000"
      - key: AUTH_REFRESH_RATE_LIMIT
        value: "120"
      - key: AUTH_REFRESH_RATE_WINDOW_SECONDS
        value: "3600"
      - key: AUTH_REFRESH_GLOBAL_LIMIT
        value: "20000"
      # Abuse protection for heavy/LLM routes and /ws/live (defaults shown; 0 disables each limit).
      - key: MAX_REQUEST_BODY_BYTES
        value: "1000000"
      - key: MAX_IMAGE_BODY_BYTES
        value: "6000000"
      - key: HEAVY_RATE_LIMIT
        value: "30"
      - key: HEAVY_RATE_WINDOW_SECONDS
        value: "3600"
      - key: HEAVY_MAX_CONCURRENCY
        value: "4"
      - key: WS_MAX_CONNECTIONS
        value: "20"
      - key: FMP_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
